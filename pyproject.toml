[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentroute"
version = "0.5.17"
description = "A local, auditable intelligence scheduler for coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentRoute contributors" }]
keywords = ["codex", "claude-code", "model-routing", "coding-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1"]

[project.scripts]
agentroute = "agentroute.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentroute"]
artifacts = ["src/agentroute/patches/*.patch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # Typer uses Option calls as its declarative parameter API.
