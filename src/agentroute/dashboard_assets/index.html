<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentRoute</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0e1116;--panel:#161b22;--panel2:#1c232c;--line:#2a323d;--text:#e6edf3;--dim:#8b96a3;
--needs_input:#f5a524;--working:#3fb950;--waiting:#58a6ff;--stalled:#f0883e;--blocked:#f85149;
--idle:#6e7681;--done:#2ea58f;--accent:#a78bfa}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--panel2:#f0f2f5;--line:#d9dee5;
--text:#1b222b;--dim:#5d6875}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);
font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;gap:14px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);
position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
h1{font-size:15px;margin:0;letter-spacing:.2px}
nav{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px}
nav button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--dim)}
nav button.on{background:var(--panel2);color:var(--text)}
nav button b{font-weight:500;color:var(--dim);margin-left:4px}
#filter{flex:1;min-width:160px;max-width:340px;background:var(--panel);border:1px solid var(--line);
border-radius:8px;padding:6px 10px}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
#live{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-left:auto}
#live i{width:8px;height:8px;border-radius:50%;background:var(--idle)}
#live.ok i{background:var(--working)}#live.bad i{background:var(--blocked)}
#tiles{display:flex;gap:10px;padding:14px 18px 6px;flex-wrap:wrap}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;min-width:104px;
cursor:pointer;border-top:3px solid var(--c,var(--line))}
.tile.off{opacity:.45}
.tile strong{display:block;font-size:22px;line-height:1.15}
.tile span{color:var(--dim);font-size:12px}
.tile.plain{cursor:default}
#attention{padding:4px 18px 0}
.alert{display:flex;gap:10px;align-items:baseline;background:var(--panel);border:1px solid var(--line);
border-left:3px solid var(--c);border-radius:8px;padding:7px 12px;margin-top:6px;cursor:pointer}
.alert em{color:var(--dim);font-style:normal}
main{padding:14px 18px 60px}
.board{display:flex;gap:12px;align-items:flex-start;overflow-x:auto}
.col{flex:1 0 270px;max-width:380px}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:0 0 8px;
display:flex;gap:8px;align-items:center}
.col h2 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:10px;
padding:10px 12px;margin-bottom:9px;cursor:pointer}
.card:hover,.card.sel{border-color:var(--c)}
.card h3{margin:0 0 3px;font-size:13.5px;font-weight:600}
.meta{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now{margin:6px 0 4px;font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
overflow:hidden}
.now code,.ev code{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim)}
.goal{font-size:12px;color:var(--dim);border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;
display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:11.5px;margin-top:7px;align-items:center}
.chip{display:inline-block;border-radius:20px;padding:1px 8px;font-size:11px;background:var(--panel2);
border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.s{color:var(--c);border-color:var(--c)}
.bar{height:4px;background:var(--panel2);border-radius:3px;overflow:hidden;flex:1;min-width:50px}
.bar i{display:block;height:100%;background:var(--accent)}
.more{background:none;border:1px dashed var(--line);border-radius:8px;width:100%;padding:6px;color:var(--dim);
cursor:pointer}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;
overflow:hidden}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:600}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
a{color:var(--waiting);cursor:pointer;text-decoration:none}
.packet{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.packet>header{position:static;border:0;padding:9px 12px;background:none;gap:8px}
.packet>header b{font-weight:600}
.item{display:grid;grid-template-columns:86px 1fr 1fr 110px;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.gates{display:flex;gap:3px;margin-top:4px}
.gates i{width:8px;height:8px;border-radius:2px;background:var(--panel2);border:1px solid var(--line)}
.gates i.passed{background:var(--working);border-color:var(--working)}
.gates i.failed,.gates i.blocked{background:var(--blocked);border-color:var(--blocked)}
.gates i.pending,.gates i.waived{background:var(--needs_input);border-color:var(--needs_input)}
.tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.focus{max-width:1040px;margin:0 auto}
.headline{font-size:15px;line-height:1.7;margin:4px 0 6px}
.headline b{font-size:22px;font-weight:650;margin-right:3px}
.headline span{margin-right:18px;white-space:nowrap}
.headline .you b{color:var(--needs_input)}.headline .none b{color:var(--blocked)}
.focus h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:22px 0 4px;font-weight:650}
.focus h2 b{color:var(--text);margin-left:4px}
.focus .lead{color:var(--dim);margin:0 0 8px;max-width:760px}
.hold{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c,var(--line));
border-radius:9px;padding:9px 13px;margin-bottom:7px}
.hold.link{cursor:pointer}
.hold .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.hold .hd b{font-weight:600}
.hold .hd .meta{margin-left:auto;white-space:nowrap}
.hold .why{margin-top:3px}
.hold .fix{margin-top:4px;padding:5px 9px;background:var(--panel2);border-radius:6px}
.hold .fix span{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-right:6px}
.hold .meta{margin-top:3px}
.packet-action,.reply-button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;padding:5px 10px;cursor:pointer}
.packet-action{margin-top:7px;text-align:left}
.packet-action:hover,.reply-button:hover{border-color:var(--waiting)}
.reply-button.primary{background:var(--text);color:var(--panel);font-weight:650}
.reply-button:disabled{cursor:default;opacity:.45}
#packet-reply{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;
width:min(580px,calc(100vw - 24px));max-height:calc(100dvh - 36px);padding:20px;overflow:auto}
#packet-reply::backdrop{background:rgba(0,0,0,.48)}
#packet-reply h2{font-size:17px;margin:0 0 5px}
#packet-reply h3{font-size:13px;margin:18px 0 5px}
#packet-reply form{display:grid;gap:12px;margin-top:14px}
#packet-reply label{display:grid;gap:4px;font-weight:600}
#packet-reply select,#packet-reply textarea{width:100%;min-width:0}
#packet-reply textarea{resize:vertical;border:1px solid var(--line);border-radius:8px;padding:9px;
background:var(--bg);min-height:110px;font-weight:400}
#packet-reply .meta{white-space:normal;overflow-wrap:anywhere}
#packet-reply .reply-route{display:flex;align-items:start;justify-content:space-between;gap:12px}
#reply-owner{font-weight:600;overflow-wrap:anywhere}
#reply-open{flex:none}
#packet-reply .reply-actions{display:flex;justify-content:flex-end;gap:8px}
#reply-history{padding:0;list-style:none;margin:0}
#reply-history li{padding:7px 0;border-top:1px solid var(--line)}
#reply-notice:empty{display:none}
.chip.late{color:var(--blocked);border-color:var(--blocked)}
details.grp{margin-bottom:7px}
details.grp>summary{cursor:pointer;padding:7px 12px;background:var(--panel);border:1px solid var(--line);
border-radius:9px;list-style:none;display:flex;gap:10px;align-items:baseline}
details.grp>summary::before{content:"▸";color:var(--dim)}details.grp[open]>summary::before{content:"▾"}
details.grp>summary b{font-weight:600}
details.grp>div{padding:7px 0 0 16px}
.line{display:flex;gap:10px;align-items:baseline;padding:5px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.line:last-child{border-bottom:0}
.line i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;transform:translateY(-1px)}
.line b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
.line span{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.claim{display:grid;grid-template-columns:110px 190px 1fr;gap:12px;align-items:center;padding:5px 2px}
.claim .bar{height:8px}.claim .bar.full i{background:var(--blocked)}
#map{width:100%;height:600px;min-height:420px;background:var(--panel);border:1px solid var(--line);
border-radius:10px;cursor:grab;display:block}
#map text{fill:var(--text);font-size:11px;pointer-events:none}
#map .t text{fill:var(--dim);font-size:10px;opacity:0}
#map.zoom .t text,#map .t.shared text,#map .t.hi text{opacity:1}
#map line{stroke:var(--line);stroke-width:1}
#map line.hi{stroke:var(--accent);stroke-width:1.6}
#map .dimmed{opacity:.12}
#map g.node{cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--dim);font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--panel);
border-left:1px solid var(--line);overflow-y:auto;z-index:10;padding:16px 18px 40px;
box-shadow:-8px 0 30px rgba(0,0,0,.35)}
#drawer h2{margin:0 30px 4px 0;font-size:16px}
#drawer h4{margin:18px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
#drawer .x{position:absolute;top:12px;right:14px;border:0;background:none;font-size:20px;cursor:pointer;
color:var(--dim)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px}
.kv dt{color:var(--dim)}.kv dd{margin:0;overflow-wrap:anywhere}
.hist div{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;margin:2px 0}
.ev{display:grid;grid-template-columns:58px 84px 1fr;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);
font-size:12px}
.ev .bad{color:var(--blocked)}
.ev code{overflow-wrap:anywhere}
.empty{color:var(--dim);padding:30px;text-align:center}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
svg.chart{display:block;width:100%;height:220px}
.axis{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}.item{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>AgentRoute</h1>
  <nav id="tabs"></nav>
  <input id="filter" type="search" placeholder="Filter by title, repo, model, tool" aria-label="Filter">
  <select id="window" aria-label="Time window">
    <option value="3600">Last hour</option><option value="21600">Last 6 hours</option>
    <option value="86400" selected>Last 24 hours</option><option value="259200">Last 3 days</option>
    <option value="604800">Last 7 days</option>
  </select>
  <span id="live"><i></i><span>connecting</span></span>
</header>
<section id="tiles"></section>
<section id="attention"></section>
<main id="view"></main>
<aside id="drawer" hidden></aside>
<dialog id="packet-reply" aria-labelledby="reply-heading">
  <h2 id="reply-heading">Reply to work packet</h2>
  <div id="reply-context" class="meta"></div>
  <form id="reply-form">
    <div class="reply-route">
      <div>
        <div id="reply-owner"></div>
        <div id="reply-target-hint" class="meta"></div>
      </div>
      <button type="button" class="reply-button" id="reply-open"
              aria-describedby="reply-target-hint" disabled>Open in Herdr</button>
    </div>
    <label>Template
      <select id="reply-template">
        <option value="continue">Continue work</option>
        <option value="hold">Hold work</option>
        <option value="details">Ask for details</option>
        <option value="custom">Write my own</option>
      </select>
    </label>
    <label>Message
      <textarea id="reply-message" required maxlength="2000" rows="5"></textarea>
    </label>
    <p class="meta" style="margin:0">Your reply asks an agent to act on this packet. Existing claims and approvals stay in place.</p>
    <div id="reply-notice" role="status" class="meta"></div>
    <div class="reply-actions">
      <button type="button" class="reply-button" id="reply-close">Close</button>
      <button type="submit" class="reply-button primary" id="reply-send">Send reply</button>
    </div>
  </form>
  <h3>Recent replies</h3>
  <ul id="reply-history"></ul>
</dialog>
<script>
"use strict";
const STATES = {needs_input:"Asking you", working:"Working", waiting:"Waiting", stalled:"Stalled",
  blocked:"Blocked", idle:"Idle", done:"Done"};
const TABS = {focus:"Focus", board:"Board", map:"Map", waits:"Waits", packets:"Work packets", usage:"Usage"};
const HOLD = {you:"needs_input", unowned:"blocked", external:"waiting", worker:"waiting", coordination:"stalled"};
const HOLD_LABEL = {external:"outside party", worker:"another agent", coordination:"needs coordination"};
const HOLD_GROUP = {coordination:["Needs coordination between owners", "A supervisor needs to investigate or settle a handoff."],
  worker:["Waiting on another agent", "Another session owns the next result."],
  external:["Waiting on an outside party", "CI, a provider, a customer or a person outside these sessions."]};
const KIND_COLOR = {dir:"#8b96a3", github:"#58a6ff", pr:"#a78bfa", host:"#f0883e", service:"#f5a524",
  web:"#2ea58f", mcp:"#db61a2", file:"#6e7681", agent:"#3fb950", packet:"#e3b341"};
const PALETTE = ["#58a6ff","#3fb950","#f5a524","#a78bfa","#f85149","#2ea58f","#db61a2","#e3b341","#8b96a3"];
const S = {snap:null, tab:Object.hasOwn(TABS, location.hash.slice(1).split("/")[0]) ? location.hash.slice(1).split("/")[0] : "focus", filter:"", window:86400,
  selected:null, hidden:new Set(), expanded:new Set(), showDone:false, source:null, last:0,
  positions:new Map(), view:{x:0,y:0,k:1}, viewTouched:false, focus:null, mapKey:"", detailAt:0};

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function num(n){ if(n==null) return "–"; const a=Math.abs(n);
  return a>=1e9?(n/1e9).toFixed(2)+"B":a>=1e6?(n/1e6).toFixed(1)+"M":a>=1e3?(n/1e3).toFixed(1)+"k":String(n); }
function span(seconds){ if(seconds==null||isNaN(seconds)) return "–"; seconds=Math.max(0,Math.round(seconds));
  return seconds<60?seconds+"s":seconds<3600?Math.floor(seconds/60)+"m":seconds<86400?
    Math.floor(seconds/3600)+"h "+Math.floor(seconds%3600/60)+"m":Math.floor(seconds/86400)+"d "+
    Math.floor(seconds%86400/3600)+"h"; }
const ago = at => at ? span(Date.now()/1000-at)+" ago" : "–";
const clock = at => at ? new Date(at*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "";
const stamp = at => at ? new Date(at*1000).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",
  minute:"2-digit"}) : "–";
const agentById = id => (S.snap?.agents || []).find(a => a.id === id);

function connect(){
  if(S.source) S.source.close();
  S.source = new EventSource("/api/events?window="+S.window);
  S.source.onmessage = message => {
    const update = JSON.parse(message.data);
    S.snap = Object.assign(S.snap && S.snap.window===update.window ? S.snap : {}, update);
    S.last = Date.now();
    const changed = Object.keys(update).filter(k => k!=="generated_at" && k!=="window");
    if(changed.length) render(changed);
    if(S.selected && Date.now()-S.detailAt > 4000) loadDetail();
  };
  S.source.onerror = () => setLive(false);
}
function setLive(ok){ const el=$("live"); el.className = ok ? "ok" : "bad";
  el.lastElementChild.textContent = ok ? "live · "+clock(S.snap.generated_at) : "disconnected, retrying"; }
setInterval(() => { if(S.snap) setLive(Date.now()-S.last < 8000); }, 1000);

function matches(agent){
  if(!S.filter) return true;
  const hay = [agent.title, agent.cwd, agent.model, agent.backend, agent.branch, agent.nickname, agent.path,
    agent.state, agent.pane?.workspace, agent.goal?.objective, Object.keys(agent.activity.tools).join(" "),
    Object.keys(agent.activity.programs).join(" "),
    agent.activity.targets.map(t=>t.label).join(" ")].join(" ").toLowerCase();
  return S.filter.toLowerCase().split(/\s+/).every(word => hay.includes(word));
}
const visibleAgents = () => S.snap.agents.filter(matches);

function render(changed){
  if(!S.snap?.summary) return;
  setLive(true);
  const s = S.snap.summary;
  $("tabs").innerHTML = Object.entries(TABS).map(([key,label]) => {
    const count = key==="waits" ? s.pending_waits : key==="packets" ? s.open_packet_items :
      key==="board" ? s.agents : key==="focus" ? (S.snap.focus?.counts.needs_you ?? "") : "";
    return `<button class="${S.tab===key?"on":""}" data-tab="${key}">${label}${count!==""?`<b>${count}</b>`:""}</button>`;
  }).join("");
  $("tiles").innerHTML = Object.entries(STATES).map(([key,label]) =>
    `<div class="tile ${S.hidden.has(key)?"off":""}" style="--c:var(--${key})" data-state="${key}"
      title="Show or hide this state on the board"><strong>${s[key]}</strong><span>${label}</span></div>`).join("") +
    `<div class="tile plain"><strong>${num(s.tokens)}</strong><span>tokens · ${s.turns} turns</span></div>
     <div class="tile plain" title="Progress reviews and approval reviews run as separate short threads">
       <strong>${s.reviewers.count}</strong><span>reviews · ${num(s.reviewers.tokens)} tokens</span></div>`;
  $("attention").innerHTML = S.snap.attention.slice(0,6).map(item =>
    `<div class="alert" style="--c:var(--${item.state==="wait"?"stalled":item.state})" data-agent="${esc(item.agent)}">
      <b>${esc(item.title)}</b><em>${esc(item.reason)}</em></div>`).join("");
  $("tiles").hidden = $("attention").hidden = S.tab==="focus";
  if(S.tab==="map"){ if(!changed || changed.includes("agents")) renderMap(); return; }
  const need = {focus:["focus","agents"], board:["agents"], waits:["waits","agents"], packets:["packets","agents"], usage:["usage","agents","summary"]}[S.tab];
  if(!changed || need.some(name => changed.includes(name)))
    $("view").innerHTML = ({focus:focusView, board:boardView, waits:waitsView, packets:packetsView, usage:usageView}[S.tab])();
}

const packetActionsUrl = "/api/packet-actions";
const threadId = value => typeof value === "string" &&
  /^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(value);
const replyTemplates = {
  continue: "Please review this packet and continue any next step that is ready and already authorized. If it is still blocked, report the decision or evidence needed to proceed.",
  hold: "Please keep this packet on hold, preserve its current ownership, and wait for my next instruction. Tell me if anything has already started that requires attention.",
  details: "Please explain what is blocking this packet, what you have verified, and the specific decision or evidence you need to continue.",
  custom: "",
};
let packetActionToken = "";
let reply = null;
let replyPolling = null;
const uncertainSends = new Map();
const replyDrafts = new Map();
const pendingStorageKey = key => "agentroute:pending-reply:" + key;
function pendingReply(key){
  if(uncertainSends.has(key)) return uncertainSends.get(key);
  try {
    const saved = JSON.parse(sessionStorage.getItem(pendingStorageKey(key)));
    return saved && Date.now()-saved.at < 86400000 ? saved.body : null;
  } catch {
    return null;
  }
}
function savePendingReply(key, body){
  if(body) uncertainSends.set(key,body);
  else uncertainSends.delete(key);
  try {
    if(body) sessionStorage.setItem(pendingStorageKey(key),JSON.stringify({at:Date.now(),body}));
    else sessionStorage.removeItem(pendingStorageKey(key));
  } catch {
    // The current page still retains the retry reference when storage is disabled.
  }
}

async function enablePacketActions(){
  if(!globalThis.crypto?.randomUUID) return;
  const access = /^#access=([A-Za-z0-9_-]{43})$/.exec(location.hash);
  if(access) history.replaceState(null, "", "#focus");
  try {
    const token = access ? access[1] : sessionStorage.getItem("agentroute-packet-access");
    if(!token) return;
    const response = await fetch(packetActionsUrl, {cache:"no-store", redirect:"error",
      headers:{"X-AgentRoute-Token":token}});
    if(!response.ok) {
      sessionStorage.removeItem("agentroute-packet-access");
      return;
    }
    packetActionToken = token;
    try { sessionStorage.setItem("agentroute-packet-access",token); } catch {}
    render();
  } catch {
    // The dashboard still works when packet actions are unavailable.
  }
}
function packetAction(namespace, packet, item){
  if(!packetActionToken || !item || !Number.isInteger(item.revision) ||
     ["done", "cancelled"].includes(item.status)) return "";
  return `<button type="button" class="packet-action" data-reply-packet
    data-namespace="${esc(namespace)}" data-packet="${esc(packet)}" data-item="${esc(item.id)}"
    >Open or reply</button>`;
}
function sessionLabel(id){
  const agent = agentById(id);
  const name = agent?.title || agent?.nickname;
  return name ? `${name} · ${id.slice(0,8)}` : id;
}
function replyContext(namespace, packet, item){
  const record = S.snap?.packets.find(p => p.namespace === namespace && p.id === packet);
  const outcome = record?.items.find(i => i.id === item);
  if(!outcome || !Number.isInteger(outcome.revision) ||
     ["done", "cancelled"].includes(outcome.status)) return null;
  return {namespace, packet, item, revision:outcome.revision, objective:outcome.objective,
    assignment:outcome.session, key:[namespace,packet,item].join("/")};
}
function replyIsCurrent(current){
  const latest = replyContext(current.namespace,current.packet,current.item);
  return latest && latest.revision === current.revision && latest.assignment === current.assignment;
}
function showReplyRoute(current){
  const {route,pending} = current;
  let title, hint;
  if(pending?.recipient){
    title = "Retry to " + sessionLabel(pending.recipient);
    hint = "This retry keeps the recipient and reference of your previous submission.";
  } else if(route?.kind === "owner"){
    title = "To " + sessionLabel(route.thread);
    hint = route.reply_issue || "Open the owner’s conversation in Herdr.";
  } else if(route?.kind === "review"){
    title = "Packet review session";
    const next = route.thread ? "This packet’s review session will reopen in Herdr." :
      "A dedicated Herdr conversation will be created for this packet.";
    hint = (route.assignment ? `Recorded assignment: ${route.assignment}. ` : "") + next;
  } else {
    title = current.routeError ? "Session route unavailable" : "Finding the packet’s session…";
    hint = current.routeError || "";

  $("reply-owner").textContent = title;
  $("reply-target-hint").textContent = hint;
}
function setReplyControls(current){

  const stale = !replyIsCurrent(current);
  $("reply-template").disabled = $("reply-message").disabled = waiting || busy;
  $("reply-send").disabled = busy || (!waiting && (!current.route || current.route.reply_issue || stale));
  $("reply-open").disabled = busy || waiting || stale || !current.route;
  $("reply-close").disabled = busy;
  $("reply-open").textContent = current.opening ? "Opening…" : "Open in Herdr";
  $("reply-send").textContent = current.sending ? "Sending…" :
    waiting ? "Retry same reply" : "Send reply";
}
function rememberReplyDraft(){
  if(!reply || reply.pending) return;
  const message = $("reply-message").value;
  // Reopening restores a typed draft without interfering with a persisted send retry.
  if(message){
    replyDrafts.set(reply.key,{message, template:$("reply-template").value});
  } else {
    replyDrafts.delete(reply.key);
  }
}
function openPacketReply(button){
  const {namespace,packet,item} = button.dataset;
  const context = replyContext(namespace, packet, item);
  if(!context) return;
  const pending = pendingReply(context.key);
  const draft = replyDrafts.get(context.key);
  reply = {...context, pending, route:null, receipts:new Map()};
  $("reply-context").textContent = `${context.objective} · ${context.key}`;
  $("reply-template").value = pending ? "custom" : draft?.template || "continue";
  $("reply-message").value = pending?.message ?? draft?.message ?? replyTemplates.continue;
  showReplyRoute(reply);
  $("reply-notice").textContent = pending ?
    "Delivery is unconfirmed. Retry sends the original reply with the same reference." : "";
  $("reply-history").replaceChildren(Object.assign(document.createElement("li"),{textContent:"Loading…",className:"meta"}));
  setReplyControls(reply);
  $("packet-reply").showModal();
  loadReplyHistory(reply);
  replyPolling = setInterval(() => { if(reply) loadReplyHistory(reply); }, 5000);
}
function receiptStatus(receipt){
  const delivery = receipt.delivery || {};
  if(receipt.disposition) return `Agent response: ${receipt.disposition.action || "recorded"}`;
  if(receipt.recipient_read) return "Read by session";
  if(receipt.state === "undeliverable" || delivery.state === "failed") return "Delivery failed";
  if(delivery.state === "unknown") return "Delivery being verified";
  if(receipt.delivery_issue) return receipt.delivery_issue;
  if(delivery.state === "inbox_pending") return "Waiting for supervisor inbox receipt";
  if(receipt.state === "delivered" || delivery.state === "delivered") {
    return delivery.mode === "existing_or_queued" ? "Accepted by Codex" : "Delivered to session";
  }
  if(receipt.daemon_ready === false) return "Saved · delivery service unavailable";
  return "Queued";
}
function herdrStatus(result){
  const pane = result.pane || result.herdr?.pane;
  const session = result.session || result.herdr?.session;
  const issue = result.herdr_issue || result.herdr?.issue;
  if(pane) return `Herdr · ${session ? session + " / " : ""}${pane}`;
  return issue ? `Herdr · ${issue}` : "";
}
function replyStatus(result){
  return [receiptStatus(result), herdrStatus(result), result.id].filter(Boolean).join(" · ");
}
function showReplyReceipts(current){
  const list = $("reply-history");
  const receipts = [...current.receipts.values()].sort((a,b) => b.created_at-a.created_at);
  list.replaceChildren(...receipts.map(receipt => {
    const row = document.createElement("li");
    const status = document.createElement("strong");
    status.textContent = receiptStatus(receipt);
    const details = document.createElement("div");
    details.className = "meta";
    details.textContent = [sessionLabel(receipt.recipient), stamp(receipt.created_at),
      receipt.id, herdrStatus(receipt)].filter(Boolean).join(" · ");
    row.append(status, details);
    return row;
  }));
  if(!receipts.length){
    const empty = document.createElement("li");
    empty.className = "meta";
    empty.textContent = current.loading ? "Loading…" :
      current.historyError ? "Reply history is unavailable." : "No replies yet.";
    list.append(empty);
  }
}
async function packetRequest(url, options = {}){
  return fetch(url, {...options, cache:"no-store", redirect:"error", signal:AbortSignal.timeout(15000),
    headers:{"X-AgentRoute-Token":packetActionToken,...options.headers}});
}
async function loadReplyHistory(current){
  if(current.loading) return;
  const generation = current.generation;
  current.loading = true;
  try {
    const {namespace,packet,item} = current;
    const query = new URLSearchParams({namespace,packet,item});
    const response = await packetRequest(`${packetActionsUrl}?${query}`);
    const {receipts,route} = await response.json();
    if(reply !== current || generation !== current.generation) return;
    if(!response.ok || !Array.isArray(receipts)) throw new Error("Reply history is unavailable.");
    current.historyError = false;
    if(route && !route.error &&
        (route.kind === "review" || (route.kind === "owner" && threadId(route.thread)))){
      current.route = route;
      current.routeError = "";
    } else {
      current.route = null;
      current.routeError = route?.error || "The dashboard could not resolve a session for this outcome.";
    }
    for(const receipt of receipts) current.receipts.set(receipt.id,receipt);
  } catch {
    current.historyError = true;
    current.route = null;
    current.routeError = "Could not check the packet’s session. The dashboard will retry.";
  } finally {
    current.loading = false;
    if(reply === current){
      showReplyRoute(current);
      setReplyControls(current);
      showReplyReceipts(current);
    }
  }
}
async function openPacketHerdr(){
  const current = reply;
  if(!current || current.sending || current.opening || current.pending || !current.route) return;
  if(!replyIsCurrent(current)){
    $("reply-notice").textContent = "The packet changed. Reopen this reply from the updated packet.";
    return;
  }
  const {namespace,packet,item,revision} = current;
  current.opening = true;
  setReplyControls(current);
  $("reply-notice").textContent = "Opening the session in Herdr…";
  try {
    const response = await packetRequest(packetActionsUrl, {method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"open",namespace,packet,item,revision,
        ...(current.route.thread ? {recipient:current.route.thread} : {})})});
    const result = await response.json();
    $("reply-notice").textContent = response.ok && result.pane ?
      `Opened ${sessionLabel(result.recipient) || "session"} · ${herdrStatus(result)}` :
      result.error || herdrStatus(result) || "Herdr did not confirm that the session opened.";
  } catch {
    $("reply-notice").textContent = "Herdr did not confirm that the session opened.";
  } finally {
    current.opening = false;
    setReplyControls(current);
    loadReplyHistory(current);
  }
}
async function sendPacketReply(event){
  event.preventDefault();
  const current = reply;
  if(!current || current.sending || current.opening) return;
  if(!current.pending){
    if(!current.route || current.route.reply_issue) return;
    const {namespace,packet,item,revision,key} = current;
    if(!replyIsCurrent(current)){
      $("reply-notice").textContent = "The packet changed. Reopen this reply from the updated packet.";
      return;
    }
    const message = $("reply-message").value.trim();
    if(!message){
      $("reply-notice").textContent = "Enter a message.";
      return;
    }
    current.pending = {namespace,packet,item,revision,message,request_id:crypto.randomUUID(),
      ...(current.route.thread ? {recipient:current.route.thread} : {})};
    savePendingReply(key,current.pending);
  }
  current.sending = true;
  current.generation = (current.generation || 0) + 1;
  $("reply-notice").textContent = "Sending reply…";
  setReplyControls(current);
  let notice;
  try {
    const response = await packetRequest(packetActionsUrl, {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(current.pending)});
    const receipt = await response.json();
    if(response.ok && receipt.id && receipt.daemon_ready === false){
      current.receipts.set(receipt.id,receipt);
      notice = "Reply saved. Retry to start delivery without sending a duplicate.";
    } else if(response.ok && receipt.id){
      current.receipts.set(receipt.id,receipt);
      savePendingReply(current.key,null);
      current.pending = null;
      replyDrafts.delete(current.key);
      notice = replyStatus(receipt);
      if(reply === current){
        $("reply-template").value = "custom";
        $("reply-message").value = "";
      }
    } else if(response.status >= 400 && response.status < 500 && response.status !== 408){
      const attemptedMessage = current.pending.message;
      savePendingReply(current.key,null);
      current.pending = null;
      notice = receipt.error || "The reply could not be sent.";
      if(reply === current) $("reply-message").value = attemptedMessage;
    } else {
      throw new Error("Delivery unconfirmed");
    }
  } catch {
    notice = "Delivery is unconfirmed. Retry to check or send the same reply without duplicating it.";
  } finally {
    current.sending = false;
    if(reply === current){
      $("reply-notice").textContent = notice;
      setReplyControls(current);
      showReplyReceipts(current);
      loadReplyHistory(current);
    }
  }
}
$("reply-close").addEventListener("click", () => $("packet-reply").close());
$("packet-reply").addEventListener("cancel", event => {

$("packet-reply").addEventListener("close", () => {

    e.session ? `Held by session <code>${esc(e.session.slice(0,28))}</code>, which is outside this view` : "No session holds this";
  return `<div class="hold ${e.agent?"link":""}" style="--c:var(--${HOLD[e.kind]||"idle"})" ${e.agent?`data-agent="${esc(e.agent)}"`:""}>

          ${packetAction(p.namespace,p.id,i)}</div>
        <div>${i.hold&&i.hold.blocking?`<div><span class="chip s" style="--c:var(--${HOLD[i.hold.kind]})">${
          i.hold.kind==="you"?"needs you":i.hold.kind==="unowned"?"no owner":"held: "+esc(i.hold.owner||HOLD_LABEL[i.hold.kind])}</span></div>`:""}
          <span class="meta">Next</span> ${esc(i.next_action)}${i.checkpoint?`<div class="meta" title="${esc(i.checkpoint)}">checkpoint ${ago(i.checkpoint_at)}</div>`:""}</div>
        <div>${i.criteria_total?`${i.criteria_met}/${i.criteria_total} criteria`:""}
          <div class="gates" title="${esc(Object.entries(i.gates).map(([k,v])=>k+": "+(v||"open")).join(", "))}">${
            Object.values(i.gates).map(v=>`<i class="${esc(v||"")}"></i>`).join("")}</div>
          ${i.session?`<div class="meta">${agentLink(i.session)}</div>`:""}</div></div>`).join("")}</div>`;
  }).join("");
  return `<div class="tools"><label><input type="checkbox" id="showDone" ${S.showDone?"checked":""}> Show finished outcomes</label></div>` +
    (blocks || `<div class="empty">No open work packet outcomes.</div>`);
}

function usageView(){
  const u = S.snap.usage, models = u.models.map(m => m.model), W = 1000, H = 220, pad = 0;
  const colorOf = model => PALETTE[models.indexOf(model) % PALETTE.length];
  const count = Math.max(1, Math.ceil(S.snap.window / u.bucket_seconds));
  const totals = u.buckets.map(b => Object.values(b.models).reduce((x,y)=>x+y,0));
  const peak = Math.max(1, ...totals), width = (W-pad*2)/count;
  const bars = u.buckets.map(b => { let y = H;
    const x = pad + Math.round((b.at-u.start)/u.bucket_seconds)*width;
    return models.filter(m => b.models[m]).map(m => { const h = (H-8)*b.models[m]/peak; y -= h;
      return `<rect x="${x+1}" y="${y}" width="${Math.max(1,width-2)}" height="${h}" fill="${colorOf(m)}"><title>${esc(m)} ${num(b.models[m])} at ${clock(b.at)}</title></rect>`;
    }).join(""); }).join("");
  const axis = [0,.25,.5,.75,1].map(f => `<span>${stamp(u.start+f*S.snap.window)}</span>`).join("");
  const top = [...S.snap.agents].sort((a,b)=>b.tokens_window-a.tokens_window).slice(0,12);
  return `<div class="chartbox"><div class="meta">Tokens by model · peak ${num(peak)} per ${span(u.bucket_seconds)}</div>
      <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}</svg><div class="axis">${axis}</div></div>
    <div class="two"><table><tr><th>Model</th><th>Backend</th><th class="n">Tokens</th><th class="n">Cached</th><th class="n">Turns</th></tr>
      ${u.models.map(m => `<tr><td><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${colorOf(m.model)}"></i> ${esc(m.model)}</td>
        <td>${esc(m.backend||"")}</td><td class="n">${num(m.tokens)}</td><td class="n">${m.tokens?Math.round(100*m.cached/m.tokens):0}%</td><td class="n">${m.turns}</td></tr>`).join("")}
      <tr><td colspan="2">Progress and approval reviews</td><td class="n">${num(S.snap.summary.reviewers.tokens)}</td><td></td><td class="n">${S.snap.summary.reviewers.count}</td></tr></table>
    <table><tr><th>Agent</th><th>Model</th><th class="n">Tokens</th><th class="n">Turns</th></tr>
      ${top.map(a => `<tr><td>${agentLink(a.id)}</td><td>${esc(a.model||"")}</td><td class="n">${num(a.tokens_window)}</td><td class="n">${a.turns_window}</td></tr>`).join("")}</table></div>`;
}

/* Map: agents linked to what they touch. Targets reached by more than one agent stay labelled. */
function graph(){
  const nodes = new Map(), edges = [];
  const agents = visibleAgents().filter(a => a.state!=="idle" && a.state!=="done" || Date.now()/1000-a.active_at < 6*3600)
    .slice(0,45);
  const ids = new Set(agents.map(a => a.id)), peakTokens = Math.max(1, ...agents.map(a => a.tokens_window));
  for(const a of agents) nodes.set(a.id, {id:a.id, agent:a, label:a.title, r:7+11*Math.sqrt(a.tokens_window/peakTokens)});
  for(const a of agents){
    if(a.parent && ids.has(a.parent)) edges.push({a:a.id, b:a.parent, w:3});
    const targets = a.activity.targets.filter(t => t.kind!=="file" && t.kind!=="agent").slice(0,7);
    for(const p of a.packets) targets.push({kind:"packet", label:p.packet, count:2});
    for(const t of targets){ const id = t.kind+":"+t.label;
      if(!nodes.has(id)) nodes.set(id, {id, kind:t.kind, label:t.label, r:5, degree:0});
      nodes.get(id).degree++; edges.push({a:a.id, b:id, w:1}); }
  }
  return {nodes:[...nodes.values()], edges};
}
function place(g, W, H){
  for(const n of g.nodes){ const p = S.positions.get(n.id);
    if(p){ n.x=p.x; n.y=p.y; } else { const angle=Math.random()*6.283, radius=(n.agent?.25:.45)*Math.min(W,H)*(.6+Math.random()*.6);
      n.x=W/2+Math.cos(angle)*radius; n.y=H/2+Math.sin(angle)*radius; } }
  const index = new Map(g.nodes.map(n => [n.id,n]));
  for(let step=0; step<320; step++){ const cool = 1-step/320;
    for(let i=0;i<g.nodes.length;i++) for(let j=i+1;j<g.nodes.length;j++){ const a=g.nodes[i], b=g.nodes[j];
      /* Agents carry a label beside them, so they push each other further apart than targets do. */
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy+.01; const charge=(a.agent?3.2:1)*(b.agent?3.2:1);
      const force=Math.min(70, 2400*charge/d2)*cool, d=Math.sqrt(d2);
      dx=dx/d*force; dy=dy/d*force*1.25; a.x+=dx; a.y+=dy; b.x-=dx; b.y-=dy; }
    for(const e of g.edges){ const a=index.get(e.a), b=index.get(e.b); const dx=b.x-a.x, dy=b.y-a.y,
      d=Math.sqrt(dx*dx+dy*dy)||1, pull=(d-(e.w>1?90:70))*.045*cool; a.x+=dx/d*pull; a.y+=dy/d*pull; b.x-=dx/d*pull; b.y-=dy/d*pull; }
    for(const n of g.nodes){ n.x+=(W/2-n.x)*.004*cool; n.y+=(H/2-n.y)*.004*cool; } }
  for(const n of g.nodes) S.positions.set(n.id, {x:n.x, y:n.y});
  if(!S.viewTouched) fitMap(g, W, H);
}
function fitMap(g, W, H){
  if(!g.nodes.length) return;
  const xs = g.nodes.map(n => n.x), ys = g.nodes.map(n => n.y);
  const x0 = Math.min(...xs)-30, x1 = Math.max(...xs)+230, y0 = Math.min(...ys)-30, y1 = Math.max(...ys)+30;
  const k = Math.min(1.6, W/(x1-x0), H/(y1-y0));
  S.view = {k, x:(W-(x0+x1)*k)/2, y:(H-(y0+y1)*k)/2};
}
function renderMap(){
  if(!$("map")) $("view").innerHTML = `<div class="tools"><span class="legend">${Object.entries({dir:"directory",github:"GitHub repo",pr:"pull request",
      host:"host",service:"service",web:"website",mcp:"MCP server",packet:"work packet"}).map(([k,l])=>`<span><i style="background:${KIND_COLOR[k]}"></i>${l}</span>`).join("")}</span>
      <span class="meta">Scroll to zoom, drag to pan, click a node to trace its links.</span></div><svg id="map"><g id="world"></g></svg>`;
  const svg = $("map");
  svg.style.height = Math.max(420, innerHeight - svg.getBoundingClientRect().top - scrollY - 16) + "px";
  const W = svg.clientWidth || 1000, H = svg.clientHeight || 600, g = graph();
  const key = g.nodes.map(n => n.id).sort().join("|");
  if(key !== S.mapKey){ place(g, W, H); S.mapKey = key; } else for(const n of g.nodes) Object.assign(n, S.positions.get(n.id));
  const near = new Set(); if(S.focus){ near.add(S.focus); for(const e of g.edges){ if(e.a===S.focus) near.add(e.b); if(e.b===S.focus) near.add(e.a); } }
  const index = new Map(g.nodes.map(n => [n.id,n]));
  $("world").innerHTML = g.edges.map(e => { const a=index.get(e.a), b=index.get(e.b), hi=S.focus&&(e.a===S.focus||e.b===S.focus);
      return `<line class="${hi?"hi":S.focus?"dimmed":""}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`; }).join("") +
    g.nodes.map(n => { const dim = S.focus && !near.has(n.id) ? "dimmed" : "";
      return n.agent ? `<g class="node ${dim}" data-node="${esc(n.id)}" data-agent="${n.id}" transform="translate(${n.x},${n.y})">
          <circle r="${n.r}" fill="var(--${n.agent.state})"><title>${esc(n.label)} · ${STATES[n.agent.state]}</title></circle>
          <text x="${n.r+4}" y="4">${esc(n.label.slice(0,38))}</text></g>`
        : `<g class="node t ${n.degree>1?"shared":""} ${near.has(n.id)&&S.focus?"hi":""} ${dim}" data-node="${esc(n.id)}" transform="translate(${n.x},${n.y})">
          <circle r="${n.degree>1?7:5}" fill="${KIND_COLOR[n.kind]||"#888"}" ${n.degree>1?'stroke="var(--text)" stroke-width="1.5"':""}><title>${esc(n.kind)}: ${esc(n.label)}${n.degree>1?" · shared by "+n.degree+" agents":""}</title></circle>
          <text x="9" y="3">${esc(n.label.slice(-34))}</text></g>`; }).join("");
  applyView();
}
function applyView(){ const svg = $("map"); if(!svg) return;
  $("world").setAttribute("transform", `translate(${S.view.x},${S.view.y}) scale(${S.view.k})`);
  svg.classList.toggle("zoom", S.view.k > 1.15); }

async function loadDetail(){
  if(!S.selected) return;
  S.detailAt = Date.now();
  const response = await fetch(`/api/agent/${S.selected}?window=${S.window}`);
  if(!response.ok || !S.selected) return;
  const a = await response.json(); if(a.id !== S.selected) return;
  const act = a.activity, t = act.tokens || {}, g = a.goal, toolMax = Math.max(1, ...Object.values(act.tools));
  const scroll = $("drawer").scrollTop;
  $("drawer").innerHTML = `<button class="x" data-close aria-label="Close">×</button>
    <h2>${esc(a.title || "(untitled)")}</h2>
    <span class="chip s" style="--c:var(--${a.state})">${STATES[a.state]}</span> <span class="meta">${esc(a.state_reason)}</span>
    <h4>Session</h4><dl class="kv">
      <dt>Directory</dt><dd>${esc(a.cwd)}${a.branch?" · "+esc(a.branch):""}</dd>
      <dt>Route</dt><dd>${esc([a.tier,a.model,a.effort,a.backend].filter(Boolean).join(" · "))}</dd>
      <dt>Tokens</dt><dd>${num(a.tokens_window)} in window · ${num(a.tokens_total)} total · context ${num(t.context_used)} of ${num(t.context_window)}</dd>
      ${a.pane?`<dt>Herdr</dt><dd>${esc(a.pane.workspace)} · ${esc(a.pane.pane_id)} · ${esc(a.pane.status)}</dd>`:""}
      ${a.parent?`<dt>Parent</dt><dd>${agentLink(a.parent)}</dd>`:""}
      ${a.children.length?`<dt>Workers</dt><dd>${a.children.map(agentLink).join("<br>")}</dd>`:""}
      <dt>Thread</dt><dd><code>${esc(a.id)}</code></dd>
      <dt>Last activity</dt><dd>${ago(a.active_at)}${act.compactions?` · ${act.compactions} compactions`:""}${act.partial?" · activity counted from the recent part of a long session":""}</dd></dl>
    ${a.task?`<h4>Task · ${esc(a.task.status)}</h4><div>${esc(a.task.summary)}</div>`:""}
    ${g?`<h4>Goal · ${esc(g.status)}</h4><div>${esc(g.objective)}</div>
      <div class="meta">${num(g.tokens_used)} tokens${g.token_budget?" of "+num(g.token_budget):""} · ${span(g.seconds_used)} worked</div>
      ${g.review_decision?`<div><span class="chip">completion review: ${esc(g.review_decision)}</span> ${esc(g.review_reason)}</div>`:""}`:""}
    ${act.message?`<h4>Last message · ${ago(act.message.at)}</h4><div>${esc(act.message.text)}</div>`:""}
    ${a.waits.length?`<h4>Pending waits</h4>${a.waits.map(w=>`<div>${esc(w.description)}<div class="meta">${esc(w.note)}</div></div>`).join("")}`:""}
    ${a.packets.length?`<h4>Work packets</h4>${a.packets.map(p=>`<div><span class="chip">${esc(p.status)}</span> ${esc(p.namespace)}/${esc(p.packet)}/${esc(p.item)}<div class="meta">${esc(p.next_action)}</div></div>`).join("")}`:""}
    <h4>Tools</h4><div class="hist">${Object.entries(act.tools).map(([name,count])=>`<div><span>${esc(name)}</span><span class="bar"><i style="width:${100*count/toolMax}%"></i></span><span class="meta">${count}</span></div>`).join("") || '<span class="meta">No tool calls seen.</span>'}</div>
    <div style="margin-top:6px">${Object.entries(act.programs).map(([name,count])=>`<span class="chip">${esc(name)} ${count}</span>`).join(" ")}</div>
    <h4>Interacting with</h4><div>${act.targets.map(x=>`<span class="chip" style="border-color:${KIND_COLOR[x.kind]||"#888"}">${esc(x.kind)} ${x.kind==="agent"?esc(agentById(x.label)?.title||x.label.slice(0,13)):esc(x.label)} · ${x.count}</span>`).join(" ") || '<span class="meta">Nothing recorded.</span>'}</div>
    <h4>Recent activity</h4>${a.events.slice(0,40).map(e=>`<div class="ev"><span class="meta">${clock(e.at)}</span><span class="${e.ok?"":"bad"}">${esc(e.tool)}${e.ok?"":" ✕"}</span><span>${esc(e.label)}${e.seconds?` <span class="meta">${e.seconds}s</span>`:""}<br><code>${esc(e.detail)}</code></span></div>`).join("") || '<span class="meta">No tool activity in the recent part of this session.</span>'}
    <h4>Turns</h4><table><tr><th>When</th><th>Route</th><th class="n">Tokens</th><th class="n">Time</th><th>Outcome</th></tr>
      ${a.turns.slice(0,30).map(x=>`<tr><td>${stamp(x.at)}</td><td>${esc([x.tier,x.model,x.effort].filter(Boolean).join(" · "))}<div class="meta">${esc(x.summary||x.task_type||"")} ${esc((x.reasons||[]).join(", ").toLowerCase())}</div></td>
        <td class="n">${num(x.tokens)}</td><td class="n">${x.duration_ms?span(x.duration_ms/1000):"–"}</td><td>${esc(x.outcome)}</td></tr>`).join("")}</table>
    ${a.wait_history.length?`<h4>Wait history</h4>${a.wait_history.slice(0,12).map(w=>`<div class="ev"><span class="meta">${stamp(w.created_at)}</span><span>${esc(w.state)}</span><span>${esc(w.description)}<div class="meta">${esc(w.outcome||"")}${w.disposition?" → "+esc(w.disposition):""}</div></span></div>`).join("")}`:""}`;
  $("drawer").hidden = false; $("drawer").scrollTop = scroll;
}
function select(id){ S.selected = id; if(id){ $("drawer").innerHTML = ""; loadDetail(); } else $("drawer").hidden = true;
  history.replaceState(null, "", "#"+S.tab+(id?"/"+id:"")); if(S.tab==="board") render(); }

document.addEventListener("click", event => {
  const hit = name => event.target.closest(`[data-${name}]`);
  let el;
  if((el = hit("reply-packet"))) return openPacketReply(el);
  if(hit("close")) return select(null);
  if((el = hit("tab"))){ S.tab = el.dataset.tab; S.focus = null; $("view").innerHTML = ""; history.replaceState(null,"","#"+S.tab); return render(); }
  if((el = hit("state"))){ const key = el.dataset.state; S.hidden.has(key) ? S.hidden.delete(key) : S.hidden.add(key);
    if(S.tab!=="board"){ S.tab="board"; $("view").innerHTML=""; } return render(); }
  if((el = hit("expand"))){ S.expanded.add(el.dataset.expand); return render(); }
  if((el = event.target.closest("details.grp>summary"))){ const key = "g-"+el.parentElement.dataset.group;
    S.expanded.has(key) ? S.expanded.delete(key) : S.expanded.add(key); return; }
  if((el = hit("node")) && S.tab==="map"){ S.focus = S.focus===el.dataset.node ? null : el.dataset.node; renderMap();
    if(el.dataset.agent) select(el.dataset.agent); return; }
  if((el = hit("agent")) && agentById(el.dataset.agent)) return select(el.dataset.agent);
  if(event.target.id==="map"){ S.focus = null; renderMap(); }
});
document.addEventListener("change", event => {
  if(event.target.id==="showDone"){ S.showDone = event.target.checked; render(); }
  if(event.target.id==="window"){ S.window = +event.target.value; S.snap = null; S.mapKey = ""; connect(); if(S.selected) loadDetail(); }
});
$("filter").addEventListener("input", event => { S.filter = event.target.value.trim(); render(); });
document.addEventListener("keydown", event => {
  if(event.key==="Escape" && !$("packet-reply").open) select(null);
});
document.addEventListener("wheel", event => { const svg = event.target.closest?.("#map"); if(!svg) return; event.preventDefault();
  const box = svg.getBoundingClientRect(), mx = event.clientX-box.left, my = event.clientY-box.top;
  const k = Math.min(5, Math.max(.3, S.view.k*Math.exp(-event.deltaY*.0015)));
  S.view.x = mx-(mx-S.view.x)*k/S.view.k; S.view.y = my-(my-S.view.y)*k/S.view.k; S.view.k = k; S.viewTouched = true; applyView(); }, {passive:false});
let drag = null;
document.addEventListener("mousedown", event => { if(event.target.closest?.("#map") && !event.target.closest("[data-node]"))
  drag = {x:event.clientX-S.view.x, y:event.clientY-S.view.y}; });
document.addEventListener("mousemove", event => { if(drag){ S.view.x = event.clientX-drag.x; S.view.y = event.clientY-drag.y; S.viewTouched = true; applyView(); } });
document.addEventListener("mouseup", () => { drag = null; });

const opened = location.hash.slice(1).split("/")[1];
if(!TABS[S.tab]) S.tab = "board";
connect();
enablePacketActions();
if(opened){ S.selected = opened; loadDetail(); }
</script>
