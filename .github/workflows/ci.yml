name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras
      - run: uv run pytest
      - run: uv run ruff check .
      - run: sh -n scripts/*.sh packaging/*.sh assets/desktop/codex-launcher
      - run: uv build --wheel
      - name: Verify wheel contains runtime patches and Desktop assets
        run: |
          unzip -l dist/*.whl | grep 'agentroute/patches/codex-user-prompt-model-override.patch'
          unzip -l dist/*.whl | grep 'agentroute/patches/codex-route-application-receipt.patch'
          unzip -l dist/*.whl | grep 'agentroute/desktop_assets/codex-launcher'
          unzip -l dist/*.whl | grep 'agentroute/code_mode_smoke.py'
          unzip -l dist/*.whl | grep 'agentroute/desktop_assets/codex-code-mode-host.entitlements.plist'

  pinned-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable fork stack at the pinned upstream release
        env:
          AGENTROUTE_UPSTREAM_CARGO_CHECK: "0"
        run: ./scripts/check_upstream.sh rust-v0.157.0
