<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AgentRoute routing Codex tasks to different models and providers</title>
  <desc id="desc">A terminal showing a fast rename routed to GPT, an architecture review routed to Azure, and a subagent research task routed to DeepSeek.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#f6f8fa"/>
  <rect x="45" y="42" width="1110" height="590" rx="18" fill="url(#shell)" filter="url(#shadow)"/>
  <path d="M45 76V60a18 18 0 0 1 18-18h1074a18 18 0 0 1 18 18v16z" fill="#1f2937"/>
  <circle cx="76" cy="68" r="7" fill="#ff5f57"/>
  <circle cx="99" cy="68" r="7" fill="#febc2e"/>
  <circle cx="122" cy="68" r="7" fill="#28c840"/>
  <text x="600" y="73" text-anchor="middle" fill="#9ca3af" font-family="Menlo, Monaco, monospace" font-size="15">AgentRoute · Codex</text>
  <g font-family="Menlo, Monaco, monospace" font-size="18">
    <text x="76" y="136" fill="#60a5fa">~</text><text x="94" y="136" fill="#94a3b8">›</text><text x="118" y="136" fill="#f8fafc">@fast rename the customer_id field</text>
    <text x="76" y="174" fill="#34d399">◆ MODEL ROUTE</text><text x="238" y="174" fill="#cbd5e1">· FAST → dev-gpt-5.6-luna · low · backend</text><text x="743" y="174" fill="#93c5fd">gpt</text>
    <text x="76" y="203" fill="#64748b">  deterministic rule · same thread · tools preserved</text>
    <text x="76" y="263" fill="#60a5fa">~</text><text x="94" y="263" fill="#94a3b8">›</text><text x="118" y="263" fill="#f8fafc">@azure @smart review the auth migration</text>
    <text x="76" y="301" fill="#fbbf24">◆ MODEL ROUTE</text><text x="238" y="301" fill="#cbd5e1">· SMART → dev-gpt-5.6-sol · high · backend</text><text x="773" y="301" fill="#c4b5fd">azure</text>
    <text x="76" y="330" fill="#64748b">  manual backend override · encrypted state boundary enforced</text>
    <text x="76" y="390" fill="#60a5fa">~</text><text x="94" y="390" fill="#94a3b8">›</text><text x="118" y="390" fill="#f8fafc">delegate competitor research to a subagent</text>
    <text x="76" y="428" fill="#22d3ee">◆ MODEL ROUTE</text><text x="238" y="428" fill="#cbd5e1">· NORMAL → deepseek-flash · medium · backend</text><text x="802" y="428" fill="#67e8f9">deepseek</text>
    <text x="76" y="457" fill="#64748b">  scope subagent · isolated affinity · usage recorded</text>
    <text x="76" y="524" fill="#60a5fa">~</text><text x="94" y="524" fill="#94a3b8">›</text><text x="118" y="524" fill="#f8fafc">agentroute why</text>
    <text x="76" y="562" fill="#a7f3d0">Selected NORMAL because the task is bounded research.</text>
    <text x="76" y="591" fill="#94a3b8">Decision, provider, latency, tokens, and cost saved locally.</text>
  </g>
</svg>
